<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Science Fair 2026</title>
  <style>
    :root{--bg:#f7f8fa;--surface:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--blue:#2563eb;--blue-soft:#eff6ff;--radius:8px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
    button,input,textarea,select{font:inherit}button{cursor:pointer}
    header{position:sticky;top:0;z-index:10;height:72px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 7%}
    .brand{border:0;background:none;font-size:18px;font-weight:700;color:var(--text)}nav{display:flex;gap:8px}.nav{border:0;background:none;color:#4b5563;padding:9px 12px;border-radius:7px;font-size:14px}.nav:hover{background:#f3f4f6}.primary{background:var(--blue);color:#fff}.primary:hover{background:#1d4ed8}
    main{width:min(1100px,86%);margin:auto;padding:64px 0 90px}.eyebrow{color:var(--blue);font-size:13px;font-weight:700;text-transform:uppercase;margin-bottom:8px}.intro{max-width:720px;margin-bottom:30px}h1{margin:0 0 10px;font-size:clamp(32px,5vw,42px);letter-spacing:-.8px}.intro p{margin:0;color:var(--muted);font-size:16px}
    .toolbar{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-bottom:42px}.input,.select,.textarea{width:100%;border:1px solid #d1d5db;background:#fff;color:var(--text);border-radius:7px;outline:0}.input,.select{height:46px;padding:0 14px}.textarea{padding:12px 14px;resize:vertical;min-height:120px}.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    .section-heading{display:flex;align-items:center;gap:14px;margin-bottom:18px}.section-heading h2{margin:0;font-size:20px}.line{height:1px;background:var(--border);flex:1}.count{color:var(--muted);font-size:13px}.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#cfd6df;box-shadow:0 8px 20px rgba(0,0,0,.04)}.card-image,.detail-image{background:var(--blue-soft);display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.06em}.card-image{height:190px}.card-content{padding:20px}.tag{display:inline-block;margin-bottom:10px;padding:4px 8px;background:#f3f4f6;color:#4b5563;border-radius:999px;font-size:11px;font-weight:700}.card h3{margin:0 0 7px;font-size:18px}.meta{margin:0 0 16px;color:var(--muted);font-size:13px}.view{border:0;background:none;padding:0;color:var(--blue);font-size:14px;font-weight:700}.view:hover{text-decoration:underline}.empty{grid-column:1/-1;padding:36px;text-align:center;border:1px dashed #d1d5db;color:var(--muted);background:#fff;border-radius:8px}
    footer{margin-top:52px;border-top:1px solid var(--border);padding-top:22px;color:var(--muted);font-size:12px}
    .overlay{position:fixed;inset:0;z-index:30;display:none;background:#fff;overflow:auto}.overlay.open{display:block}.project-header{position:sticky;top:0;background:rgba(255,255,255,.97);border-bottom:1px solid var(--border);height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 7%;z-index:2}.back{border:0;background:none;color:#4b5563;font-size:14px;padding:9px 0}.project-content{width:min(900px,90%);margin:auto;padding:36px 0 80px}.detail-image{height:320px;border-radius:8px;margin-bottom:24px}.detail-content .tag{margin-bottom:10px}.detail-content h1{font-size:38px;margin-bottom:4px}.detail-meta{color:var(--muted);font-size:14px;margin-bottom:34px}.detail-section{margin-top:26px}.detail-section h2{font-size:15px;margin:0 0 7px}.detail-section p{margin:0;color:#4b5563;white-space:pre-line}
    .dialog-bg{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(17,24,39,.38)}.dialog-bg.open{display:flex}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:10px}.dialog-head{display:flex;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--border)}.dialog-head h2{margin:0;font-size:21px}.close{width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:7px;color:#4b5563;font-size:20px}.dialog-body{padding:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.secondary,.submit{height:42px;padding:0 15px;border-radius:7px;font-weight:700;border:1px solid #d1d5db}.secondary{background:#fff;color:#4b5563}.submit{background:var(--blue);color:#fff;border-color:var(--blue)}
    @media(max-width:700px){header{padding:0 5%}main{width:90%;padding-top:48px}.toolbar,.projects,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.nav:not(.primary){display:none}.project-header{padding:0 5%}.project-content{width:90%}}
  </style>
</head>
<body>
  <header><button class="brand" id="home">Science Fair 2026</button><nav><button class="nav" id="projectsBtn">Projects</button><button class="nav primary" id="submitBtn">Submit Project</button></nav></header>
  <main id="homeView">
    <section class="intro"><div class="eyebrow">Student projects</div><h1>Student Science Fair</h1><p>Explore the projects being presented by our students.</p></section>
    <section class="toolbar"><input class="input" id="search" type="search" placeholder="Search projects..."><select class="select" id="filter"><option value="all">All subjects</option><option>Biology</option><option>Chemistry</option><option>Physics</option><option>Environmental Science</option></select></section>
    <section><div class="section-heading"><h2>Projects</h2><div class="line"></div><div class="count" id="count"></div></div><div class="projects" id="grid"></div></section>
    <footer>Science Fair 2026 · Student project showcase</footer>
  </main>

  <div class="overlay" id="projectPage"><div class="project-header"><button class="back" id="backBtn">← Back to projects</button></div><div class="project-content" id="projectContent"></div></div>

  <div class="dialog-bg" id="submitDialog"><div class="dialog"><div class="dialog-head"><h2>Submit a Project</h2><button class="close" data-close>×</button></div><div class="dialog-body"><form id="form"><div class="form-grid">
    <div class="field"><label>Student name</label><input class="input" id="name" required></div>
    <div class="field"><label>Subject</label><select class="select" id="subject" required><option value="">Choose a subject</option><option>Biology</option><option>Chemistry</option><option>Physics</option><option>Environmental Science</option></select></div>
    <div class="field full"><label>Project title</label><input class="input" id="title" required></div>
    <div class="field full"><label>Research question</label><textarea class="textarea" id="question" required></textarea></div>
    <div class="field full"><label>Hypothesis</label><textarea class="textarea" id="hypothesis" required></textarea></div>
    <div class="field full"><label>Method</label><textarea class="textarea" id="method" required></textarea></div>
    <div class="field full"><label>Results</label><textarea class="textarea" id="results" required></textarea></div>
    <div class="field full"><label>Conclusion</label><textarea class="textarea" id="conclusion" required></textarea></div>
  </div><div class="actions"><button type="button" class="secondary" data-close>Cancel</button><button class="submit">Add project</button></div></form></div></div></div>

  <script>
    const projects=[{id:1,title:'Test',name:'Test',subject:'Test',question:'Test',hypothesis:'Test',method:'Test',results:'Test',conclusion:'Test'}];
    const grid=document.getElementById('grid'),search=document.getElementById('search'),filter=document.getElementById('filter'),count=document.getElementById('count'),page=document.getElementById('projectPage'),content=document.getElementById('projectContent'),dialog=document.getElementById('submitDialog'),form=document.getElementById('form');
    const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    function render(){const q=search.value.toLowerCase().trim(),f=filter.value;const list=projects.filter(p=>(f==='all'||p.subject===f)&&(`${p.title} ${p.name} ${p.subject}`).toLowerCase().includes(q));count.textContent=`${list.length} ${list.length===1?'project':'projects'}`;grid.innerHTML=list.length?list.map(p=>`<article class="card"><div class="card-image">PROJECT IMAGE</div><div class="card-content"><div class="tag">${esc(p.subject)}</div><h3>${esc(p.title)}</h3><p class="meta">${esc(p.name)} · ${esc(p.subject)}</p><button class="view" data-id="${p.id}">View project →</button></div></article>`).join(''):'<div class="empty">No projects match your search.</div>';grid.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openProject(+b.dataset.id))}
    function openProject(id){const p=projects.find(x=>x.id===id);if(!p)return;content.innerHTML=`<div class="detail-image">PROJECT IMAGE</div><div class="detail-content"><div class="tag">${esc(p.subject)}</div><h1>${esc(p.title)}</h1><div class="detail-meta">${esc(p.name)} · ${esc(p.subject)}</div>${[['Research Question',p.question],['Hypothesis',p.hypothesis],['Method',p.method],['Results',p.results],['Conclusion',p.conclusion]].map(([h,v])=>`<section class="detail-section"><h2>${h}</h2><p>${esc(v)}</p></section>`).join('')}</div>`;page.classList.add('open');document.body.style.overflow='hidden'}
    function closePage(){page.classList.remove('open');document.body.style.overflow=''}
    search.oninput=render;filter.onchange=render;document.getElementById('projectsBtn').onclick=()=>document.getElementById('grid').scrollIntoView({behavior:'smooth'});document.getElementById('home').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});document.getElementById('backBtn').onclick=closePage;document.getElementById('submitBtn').onclick=()=>dialog.classList.add('open');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dialog.classList.remove('open'));dialog.onclick=e=>{if(e.target===dialog)dialog.classList.remove('open')};document.onkeydown=e=>{if(e.key==='Escape'){closePage();dialog.classList.remove('open')}};
    form.onsubmit=e=>{e.preventDefault();projects.unshift({id:Date.now(),title:title.value.trim(),name:name.value.trim(),subject:subject.value,question:question.value.trim(),hypothesis:hypothesis.value.trim(),method:method.value.trim(),results:results.value.trim(),conclusion:conclusion.value.trim()});form.reset();dialog.classList.remove('open');render()};render();
  </script>
</body>
</html>
