<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Science Fair 2026</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --danger: #b42318;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 72px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      backdrop-filter: blur(8px);
    }

    .brand {
      border: 0;
      background: transparent;
      padding: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-button {
      border: 0;
      background: transparent;
      color: #4b5563;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 14px;
    }

    .nav-button:hover { background: #f3f4f6; color: var(--text); }

    .nav-button.primary {
      background: var(--blue);
      color: #fff;
    }

    .nav-button.primary:hover { background: #1d4ed8; }

    .page {
      width: min(1100px, 86%);
      margin: 0 auto;
      padding: 64px 0 90px;
    }

    .intro { max-width: 720px; margin-bottom: 30px; }

    .eyebrow {
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 5vw, 42px);
      letter-spacing: -0.8px;
      line-height: 1.15;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      margin-bottom: 42px;
    }

    .input,
    .textarea,
    .select {
      width: 100%;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      border-radius: 7px;
      outline: none;
    }

    .input,
    .select { height: 46px; padding: 0 14px; }
    .textarea { padding: 12px 14px; resize: vertical; min-height: 120px; }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap 13px;
      margin-bottom: 18px;
    }
    .section-heading h2 { margin: 0; font-size: 20px; }
    .section-heading .line { height: 1px; background: var(--border); flex: 1; }
    .count { color: var(--muted); font-size: 13px; }

    .projects {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(r2.0);
      border-color: #cfd6df;
      box-shadow: 0 8 20px rgba(0, 0, 0, 0.04);
    }

    .card-image {
       height: 190px;
      background: var(--blue-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .card-image span { opacity: 0.75; }

    .card-content { padding: 20px; }

    .tag {
      display: inline-block;
      margin-bottom: 10px;
      padding: 4px 8px;
      background: #f3f4f6;
      color: #4b5563;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .card h3 { margin: 0 0 7px; font-size: 18px; }
    .meta { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

    .view-button {
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      padding: 0;
    }

    .view-button:hover { text-decoration: underline; }

    .empty {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
    }

    .footer {
      margin-top: 52px;
      border-top: 1px solid var(--border);
      padding-top: 22px;
      color: var(--muted);
      font-size: 12px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(17, 24, 39, 0.38);
    }

    .modal-backdrop.open { display: flex; }

    /* Project viewer: full-screen page instead of a popup */
    #detailModal {
      padding: 0;
      align-items: stretch;
      justify-content: stretch;
      background: var(--surface);
    }

    #detailModal .modal {
      width: 100%;
      max-width: none;
      height: 100vh;
      max-height: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    #detailModal .modal-header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(8px);
    }

    #detailModal .modal-body {
      width: min(900px, 90%);
      margin: 0 auto;
      padding: 34px 0 80px;
    }

    #detailModal .detail-image {
      height: 320px;
    }

    .modal {
      width: min(720px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.14);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 { margin: 0; font-size: 21px; }

    .close {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 7px;
      color: #4b5563;
      font-size: 20px;
      line-height: 1;
    }

    .close:hover { background: #f3f4f6; }

    .modal-body { padding: 22px; }

    .detail-image {
      height: 220px;
      background: var(--blue-soft);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 22px;
    }

    .detail-meta {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      margin-bottom: 28px;
    }

    .detail-section { margin-top: 24px; }
    .detail-section h3 { margin: 0 0 7px; font-size: 15px; }
    .detail-section p { margin: 0; color: #4b5563; white-space: pre-line; }
    .video-section { margin-top: 28px; }
    .video-section h3 { margin: 0 0 7px; font-size: 15px; }
    .project-video {
      width: 100%;
      display: block;
      max-height: 520x;
      background: #111827;
      border-radius: 7px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field { display: flex; flex-direction: column; gap: 7px; }
    .field .full { grid-column: 1 / -1; }
    .field label { font-size: 13px; font-weight: 700; }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    .secondary,
    .primary-button {
      height: 42px;
      padding: 0 15px;
      border-radius: 7px;
      font-weight: 700;
      border: 1px solid var(--border-strong);
    }

    .secondary { background: #fff; color: #x4b5563; }
    .secondary:hover { background: #f9faf9; }

    .primary-button { background: var(--blue); color: #fff; border-color: var(--blue); }
    .primary-button:hover { background: #1d4ed8; }

    .error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
