<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Fair 2026</title>
<style>
:root{
  --navy-950:#071426;--navy-900:#0b1d33;--navy-800:#102a46;--navy-700:#173a5e;
  --blue-600:#2563eb;--blue-500:#3b82f6;--blue-100:#dbeafe;--blue-50:#eff6ff;
  --cyan-500:#06b6d4;--gold-500:#f59e0b;
  --page:#f4f7fb;--surface:#fff;--text:#102033;--muted:#607086;
  --border:#d7e0ea;--border-dark:#b7c5d5;--radius:10px;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--page);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}button,input,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;height:72px;background:var(--navy-950);display:flex;align-items:center;justify-content:space-between;padding:0 7%;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.brand{border:0;background:none;color:#fff;font-size:18px;font-weight:750;padding:0}.nav-wrap{display:flex;gap:10px}.nav{border:1px solid transparent;background:transparent;color:#d8e5f3;padding:9px 13px;border-radius:7px;font-size:14px}.nav:hover{background:rgba(255,255,255,.08);color:#fff}.nav.primary{background:var(--blue-500);color:#fff}.nav.primary:hover{background:var(--blue-600)}
main{width:min(1080px,86%);margin:auto;padding:68px 0 90px}.eyebrow{display:inline-block;color:var(--blue-600);background:var(--blue-50);border:1px solid var(--blue-100);padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}.intro{max-width:720px;margin-bottom:32px}.intro h1{margin:0 0 10px;font-size:clamp(34px,5vw,46px);line-height:1.08;letter-spacing:-1.2px;color:var(--navy-950)}.intro p{margin:0;color:var(--muted);font-size:16px;max-width:620px}
.search{width:100%;height:50px;padding:0 16px;border:1px solid var(--border-dark);border-radius:8px;background:#fff;color:var(--text);outline:0;margin-bottom:44px;box-shadow:0 1px 2px rgba(7,20,38,.03)}.search::placeholder{color:#8a98aa}.search:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(59,130,246,.14)}
.section-heading{display:flex;align-items:center;gap:14px;margin-bottom:18px}.section-heading h2{margin:0;font-size:21px;color:var(--navy-950)}.line{height:1px;background:var(--border);flex:1}.count{color:var(--muted);font-size:13px}.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.card:hover{transform:translateY(-3px);border-color:#bac9d9;box-shadow:0 10px 24px rgba(7,20,38,.08)}.card-image{height:200px;background:linear-gradient(145deg,var(--navy-900),var(--navy-700));color:#cfe2f8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.08em}.card-content{padding:20px}.card h3{margin:0 0 7px;font-size:19px;color:var(--navy-950)}.meta{margin:0 0 16px;color:var(--muted);font-size:13px}.view{border:0;background:none;padding:0;color:var(--blue-600);font-size:14px;font-weight:750}.view:hover{text-decoration:underline}.empty{grid-column:1/-1;padding:40px;text-align:center;border:1px dashed var(--border-dark);color:var(--muted);background:#fff;border-radius:var(--radius)}footer{margin-top:56px;border-top:1px solid var(--border);padding-top:22px;color:var(--muted);font-size:12px}
.overlay{position:fixed;inset:0;z-index:30;display:none;background:#fff;overflow:auto}.overlay.open{display:block}.project-header{position:sticky;top:0;background:rgba(7,20,38,.97);height:72px;display:flex;align-items:center;padding:0 7%;z-index:2}.back{border:0;background:none;color:#d8e5f3;font-size:14px;padding:9px 0}.back:hover{color:#fff}.project-content{width:min(920px,90%);margin:auto;padding:38px 0 90px}.detail-image{height:340px;border-radius:var(--radius);margin-bottom:28px;background:linear-gradient(145deg,var(--navy-900),var(--navy-700));display:flex;align-items:center;justify-content:center;color:#cfe2f8;font-size:12px;font-weight:800;letter-spacing:.08em}.detail-video{min-height:220px;border-radius:var(--radius);margin-bottom:32px;background:#0a1220;border:1px solid #20344b;display:flex;align-items:center;justify-content:center;color:#bfd0e2;font-size:12px;font-weight:800;letter-spacing:.08em}.detail-content h1{font-size:40px;line-height:1.1;margin:0 0 6px;color:var(--navy-950)}.detail-meta{color:var(--muted);font-size:14px;margin-bottom:38px}.detail-section{margin-top:28px;padding-top:4px}.detail-section h2{font-size:15px;margin:0 0 8px;color:var(--navy-900)}.detail-section p{margin:0;color:#43556b;white-space:pre-line}
.dialog-bg{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(7,20,38,.55);backdrop-filter:blur(3px)}.dialog-bg.open{display:flex}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 24px 60px rgba(7,20,38,.22)}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;background:var(--navy-950);color:#fff}.dialog-head h2{margin:0;font-size:20px}.close{width:34px;height:34px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);border-radius:7px;color:#fff;font-size:20px}.close:hover{background:rgba(255,255,255,.16)}.dialog-body{padding:24px}.form-grid{display:grid;gap:17px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;font-weight:750;color:var(--navy-900)}.input,.textarea{width:100%;border:1px solid var(--border-dark);background:#fff;color:var(--text);border-radius:8px;outline:0}.input{height:46px;padding:0 13px}.textarea{padding:12px 13px;resize:vertical;min-height:110px}.input:focus,.textarea:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(59,130,246,.14)}
.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.media-box{border:1px dashed var(--border-dark);background:#f8fbff;border-radius:8px;padding:16px}.media-box label{display:block;margin-bottom:9px;color:var(--navy-900)}.media-box button{width:100%;height:42px;border:1px solid var(--border);background:#fff;color:#50647a;border-radius:7px;font-weight:700}.media-box button:disabled{cursor:not-allowed;opacity:.75}.media-note{margin:8px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.secondary,.submit{height:42px;padding:0 16px;border-radius:7px;font-weight:750;border:1px solid var(--border-dark)}.secondary{background:#fff;color:#4b5563}.secondary:hover{background:#f7f9fc}.submit{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}.submit:hover{background:#1d4ed8}
@media(max-width:700px){header{padding:0 5%}main{width:90%;padding-top:48px}.projects,.media-grid{grid-template-columns:1fr}.nav:not(.primary){display:none}.project-header{padding:0 5%}.project-content{width:90%}.detail-image{height:240px}.detail-content h1{font-size:32px}}
</style>
</head>
<body>
<header><button class="brand" id="home">Science Fair 2026</button><nav class="nav-wrap"><button class="nav" id="projectsBtn">Projects</button><button class="nav primary" id="submitBtn">Submit Project</button></nav></header>
<main>
<section class="intro"><div class="eyebrow">Student projects</div><h1>Student Science Fair</h1><p>Explore the projects being presented by our students.</p></section>
<input class="search" id="search" type="search" placeholder="Search projects..." aria-label="Search projects">
<section><div class="section-heading"><h2>Projects</h2><div class="line"></div><div class="count" id="count"></div></div><div class="projects" id="grid"></div></section>
<footer>Science Fair 2026 · Student project showcase</footer>
</main>
<div class="overlay" id="projectPage"><div class="project-header"><button class="back" id="backBtn">← Back to projects</button></div><div class="project-content" id="projectContent"></div></div>
<div class="dialog-bg" id="submitDialog"><div class="dialog"><div class="dialog-head"><h2>Submit a Project</h2><button class="close" data-close>×</button></div><div class="dialog-body"><form id="form"><div class="form-grid">
<div class="field"><label for="name">Student name</label><input class="input" id="name" required></div>
<div class="field"><label for="title">Project title</label><input class="input" id="title" required></div>
<div class="field"><label>Project media</label><div class="media-grid"><div class="media-box"><label>Project image</label><button type="button" disabled>Upload image</button><p class="media-note">Uploads will be added later.</p></div><div class="media-box"><label>Project video</label><button type="button" disabled>Upload video</button><p class="media-note">Uploads will be added later.</p></div></div></div>
<div class="field"><label for="question">Research question</label><textarea class="textarea" id="question" required></textarea></div>
<div class="field"><label for="hypothesis">Hypothesis</label><textarea class="textarea" id="hypothesis" required></textarea></div>
<div class="field"><label for="method">Method</label><textarea class="textarea" id="method" required></textarea></div>
<div class="field"><label for="results">Results</label><textarea class="textarea" id="results" required></textarea></div>
<div class="field"><label for="conclusion">Conclusion</label><textarea class="textarea" id="conclusion" required></textarea></div>
</div><div class="actions"><button type="button" class="secondary" data-close>Cancel</button><button class="submit">Add project</button></div></form></div></div></div>
<script>
const projects=[{id:1,title:'Test',name:'Test',question:'Test',hypothesis:'Test',method:'Test',results:'Test',conclusion:'Test'}];
const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),page=document.getElementById('projectPage'),content=document.getElementById('projectContent'),dialog=document.getElementById('submitDialog'),form=document.getElementById('form');
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function render(){const q=search.value.toLowerCase().trim(),list=projects.filter(p=>(`${p.title} ${p.name}`).toLowerCase().includes(q));count.textContent=`${list.length} ${list.length===1?'project':'projects'}`;grid.innerHTML=list.length?list.map(p=>`<article class="card"><div class="card-image">PROJECT IMAGE</div><div class="card-content"><h3>${esc(p.title)}</h3><p class="meta">${esc(p.name)}</p><button class="view" data-id="${p.id}">View project →</button></div></article>`).join(''):'<div class="empty">No projects match your search.</div>';grid.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openProject(+b.dataset.id))}
function openProject(id){const p=projects.find(x=>x.id===id);if(!p)return;content.innerHTML=`<div class="detail-image">PROJECT IMAGE</div><div class="detail-video">PROJECT VIDEO</div><div class="detail-content"><h1>${esc(p.title)}</h1><div class="detail-meta">${esc(p.name)}</div>${[['Research Question',p.question],['Hypothesis',p.hypothesis],['Method',p.method],['Results',p.results],['Conclusion',p.conclusion]].map(([h,v])=>`<section class="detail-section"><h2>${h}</h2><p>${esc(v)}</p></section>`).join('')}</div>`;page.classList.add('open');document.body.style.overflow='hidden'}
function closePage(){page.classList.remove('open');document.body.style.overflow=''}
search.oninput=render;document.getElementById('projectsBtn').onclick=()=>grid.scrollIntoView({behavior:'smooth'});document.getElementById('home').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});document.getElementById('backBtn').onclick=closePage;document.getElementById('submitBtn').onclick=()=>dialog.classList.add('open');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dialog.classList.remove('open'));dialog.onclick=e=>{if(e.target===dialog)dialog.classList.remove('open')};document.onkeydown=e=>{if(e.key==='Escape'){closePage();dialog.classList.remove('open')}};
form.onsubmit=e=>{e.preventDefault();projects.unshift({id:Date.now(),title:title.value.trim(),name:name.value.trim(),question:question.value.trim(),hypothesis:hypothesis.value.trim(),method:method.value.trim(),results:results.value.trim(),conclusion:conclusion.value.trim()});form.reset();dialog.classList.remove('open');render()};render();
</script>
</body>
</html>
