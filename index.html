<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Fair 2026</title>
<style>
:root{
  --navy-950:#061426;
  --navy-900:#0b1e35;
  --navy-800:#102a47;
  --navy-700:#17395c;
  --blue:#2563eb;
  --blue-bright:#3b82f6;
  --blue-soft:#eef5ff;
  --page:#f5f8fc;
  --surface:#ffffff;
  --text:#112033;
  --muted:#63758a;
  --border:#d5dfeb;
  --border-strong:#aebed0;
  --border-dark:#25425f;
  --radius:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}button{cursor:pointer}
::selection{background:#bfdbfe;color:var(--navy-950)}
header{position:sticky;top:0;z-index:20;height:72px;background:var(--navy-950);display:flex;align-items:center;justify-content:space-between;padding:0 7%;border-bottom:1px solid #1c3550;box-shadow:0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(10px)}
.brand{border:0;background:none;color:#fff;font-size:18px;font-weight:750;padding:0;transition:opacity .15s ease}.brand:hover{opacity:.84}
.nav-wrap{display:flex;gap:8px}.nav{border:1px solid #29445f;background:transparent;color:#dbe7f4;padding:9px 13px;border-radius:7px;font-size:14px;transition:background .16s ease,color .16s ease,border-color .16s ease,transform .16s ease}.nav:hover{background:#122842;color:#fff;border-color:#41607d}.nav:active{transform:translateY(1px)}.nav.primary{background:var(--blue-bright);border-color:#69a0ff;color:#fff}.nav.primary:hover{background:var(--blue);border-color:#5c93f0}
main{width:min(1080px,86%);margin:auto;padding:72px 0 92px}.intro{max-width:720px;margin-bottom:30px;animation:rise .45s ease both}.eyebrow{display:inline-block;color:#174ea6;background:var(--blue-soft);border:1px solid #c6d9f2;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}.intro h1{margin:0 0 11px;font-size:clamp(34px,5vw,46px);line-height:1.08;letter-spacing:-1.3px;color:var(--navy-950)}.intro p{margin:0;color:var(--muted);font-size:16px;max-width:640px}
.search{width:100%;height:50px;padding:0 16px;border:1px solid var(--border-strong);border-radius:9px;background:#fff;color:var(--text);outline:0;margin-bottom:44px;box-shadow:0 1px 2px rgba(6,20,38,.03);transition:border-color .18s ease,box-shadow .18s ease;animation:rise .5s .05s ease both}.search::placeholder{color:#8b9bad}.search:hover{border-color:#91a7bd}.search:focus{border-color:var(--blue-bright);box-shadow:0 0 0 4px rgba(59,130,246,.12)}
.section-heading{display:flex;align-items:center;gap:14px;margin-bottom:18px}.section-heading h2{margin:0;font-size:21px;color:var(--navy-950)}.line{height:1px;background:var(--border);flex:1}.count{color:var(--muted);font-size:13px}.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;animation:rise .42s ease both}.card:hover{transform:translateY(-3px);border-color:#9fb3c7;box-shadow:0 12px 28px rgba(6,20,38,.08)}.card:focus-within{border-color:var(--blue-bright);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.card-image,.detail-image{background:linear-gradient(145deg,var(--navy-900),var(--navy-700));display:flex;align-items:center;justify-content:center;color:#d4e5f7;font-size:11px;font-weight:800;letter-spacing:.08em;position:relative;overflow:hidden}.card-image{height:200px;border-bottom:1px solid var(--border-dark)}
.card-image::after,.detail-image::after{content:"";position:absolute;inset:-40%;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.07) 50%,transparent 65%);transform:translateX(-40%);transition:transform .7s ease}.card:hover .card-image::after{transform:translateX(40%)}
.card-content{padding:20px}.card h3{margin:0 0 7px;font-size:19px;color:var(--navy-950)}.meta{margin:0 0 16px;color:var(--muted);font-size:13px}.view{border:1px solid transparent;background:none;padding:5px 7px;margin-left:-7px;color:var(--blue);font-size:14px;font-weight:750;border-radius:6px;transition:color .15s ease,background .15s ease,border-color .15s ease}.view:hover{color:#174ac0;background:var(--blue-soft);border-color:#c9dbf5}.empty{grid-column:1/-1;padding:40px;text-align:center;border:1px dashed var(--border-strong);color:var(--muted);background:#fff;border-radius:var(--radius)}footer{margin-top:56px;border-top:1px solid var(--border);padding-top:22px;color:var(--muted);font-size:12px}
.overlay{position:fixed;inset:0;z-index:30;display:none;background:#fff;overflow:auto}.overlay.open{display:block;animation:pageIn .22s ease both}.project-header{position:sticky;top:0;background:var(--navy-950);height:72px;display:flex;align-items:center;padding:0 7%;z-index:2;border-bottom:1px solid #1c3550;box-shadow:0 1px 0 rgba(255,255,255,.05)}.back{border:1px solid #29445f;background:transparent;color:#dbe7f4;font-size:14px;padding:8px 11px;border-radius:7px;transition:color .15s ease,background .15s ease,border-color .15s ease,transform .15s ease}.back:hover{color:#fff;background:#122842;border-color:#41607d;transform:translateX(-2px)}.project-content{width:min(920px,90%);margin:auto;padding:38px 0 90px}.detail-image{height:340px;border-radius:var(--radius);margin-bottom:24px;border:1px solid var(--border-dark)}.detail-video{min-height:220px;border-radius:var(--radius);margin-bottom:32px;background:#081321;border:1px solid #27445f;display:flex;align-items:center;justify-content:center;color:#bfd1e4;font-size:12px;font-weight:800;letter-spacing:.08em}.detail-content h1{font-size:40px;line-height:1.1;margin:0 0 6px;color:var(--navy-950)}.detail-meta{color:var(--muted);font-size:14px;margin-bottom:38px;padding-bottom:18px;border-bottom:1px solid var(--border)}.detail-section{margin-top:28px;padding:18px 0 0;border-top:1px solid var(--border)}.detail-section h2{font-size:15px;margin:0 0 8px;color:var(--navy-900)}.detail-section p{margin:0;color:#43566c;white-space:pre-line}
.dialog-bg{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,20,38,.54);backdrop-filter:blur(4px)}.dialog-bg.open{display:flex;animation:fade .18s ease both}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid #b8c7d7;border-radius:12px;box-shadow:0 26px 70px rgba(6,20,38,.24);animation:modalIn .2s ease both}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;background:var(--navy-950);color:#fff;border-bottom:1px solid #29445f}.dialog-head h2{margin:0;font-size:20px}.close{width:34px;height:34px;border:1px solid #29445f;background:#10243b;border-radius:7px;color:#fff;font-size:20px;transition:background .15s ease,border-color .15s ease}.close:hover{background:#17314f;border-color:#41607d}.dialog-body{padding:24px}.form-grid{display:grid;gap:17px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;font-weight:750;color:var(--navy-900)}.input,.textarea{width:100%;border:1px solid var(--border-strong);background:#fff;color:var(--text);border-radius:8px;outline:0;transition:border-color .18s ease,box-shadow .18s ease}.input{height:46px;padding:0 13px}.textarea{padding:12px 13px;resize:vertical;min-height:110px}.input:hover,.textarea:hover{border-color:#91a7bd}.input:focus,.textarea:focus{border-color:var(--blue-bright);box-shadow:0 0 0 4px rgba(59,130,246,.12)}
.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.media-box{border:1px dashed #aebed0;background:#f8fbff;border-radius:9px;padding:16px;transition:border-color .18s ease,background .18s ease}.media-box:hover{border-color:#7893ad;background:#f5f9ff}.media-box label{display:block;margin-bottom:9px;color:var(--navy-900)}.media-box button{width:100%;height:42px;border:1px solid #c8d4e0;background:#fff;color:#50647a;border-radius:7px;font-weight:700}.media-box button:disabled{cursor:not-allowed;opacity:.75}.media-note{margin:8px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.secondary,.submit{height:42px;padding:0 16px;border-radius:7px;font-weight:750;border:1px solid var(--border-strong);transition:background .15s ease,transform .15s ease,box-shadow .15s ease}.secondary{background:#fff;color:#4b5563}.secondary:hover{background:#f7f9fc;border-color:#9cb0c4}.submit{background:var(--blue);color:#fff;border-color:#4d88f4}.submit:hover{background:#1d4ed8;box-shadow:0 5px 12px rgba(37,99,235,.2)}.secondary:active,.submit:active,.media-box button:active{transform:translateY(1px)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}@keyframes pageIn{from{opacity:0}to{opacity:1}}
@media(max-width:700px){header{padding:0 5%}main{width:90%;padding-top:48px}.projects,.media-grid{grid-template-columns:1fr}.nav:not(.primary){display:none}.project-header{padding:0 5%}.project-content{width:90%}.detail-image{height:240px}.detail-content h1{font-size:32px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><button class="brand" id="home">Science Fair 2026</button><nav class="nav-wrap"><button class="nav" id="projectsBtn">Projects</button><button class="nav primary" id="submitBtn">Submit Project</button></nav></header>
<main><section class="intro"><div class="eyebrow">Student projects</div><h1>Student Science Fair</h1><p>Explore the projects being presented by our students.</p></section><input class="search" id="search" type="search" placeholder="Search projects..." aria-label="Search projects"><section><div class="section-heading"><h2>Projects</h2><div class="line"></div><div class="count" id="count"></div></div><div class="projects" id="grid"></div></section><footer>Science Fair 2026 · Student project showcase</footer></main>
<div class="overlay" id="projectPage"><div class="project-header"><button class="back" id="backBtn">← Back to projects</button></div><div class="project-content" id="projectContent"></div></div>
<div class="dialog-bg" id="submitDialog"><div class="dialog"><div class="dialog-head"><h2>Submit a Project</h2><button class="close" data-close>×</button></div><div class="dialog-body"><form id="form"><div class="form-grid"><div class="field"><label for="name">Student name</label><input class="input" id="name" required></div><div class="field"><label for="title">Project title</label><input class="input" id="title" required></div><div class="field"><label>Project media</label><div class="media-grid"><div class="media-box"><label>Project image</label><button type="button" disabled>Upload image</button><p class="media-note">Uploads will be added later.</p></div><div class="media-box"><label>Project video</label><button type="button" disabled>Upload video</button><p class="media-note">Uploads will be added later.</p></div></div></div><div class="field"><label for="question">Research question</label><textarea class="textarea" id="question" required></textarea></div><div class="field"><label for="hypothesis">Hypothesis</label><textarea class="textarea" id="hypothesis" required></textarea></div><div class="field"><label for="method">Method</label><textarea class="textarea" id="method" required></textarea></div><div class="field"><label for="results">Results</label><textarea class="textarea" id="results" required></textarea></div><div class="field"><label for="conclusion">Conclusion</label><textarea class="textarea" id="conclusion" required></textarea></div></div><div class="actions"><button type="button" class="secondary" data-close>Cancel</button><button class="submit">Add project</button></div></form></div></div></div>
<script>
const projects=[{id:1,title:'Test',name:'Test',question:'Test',hypothesis:'Test',method:'Test',results:'Test',conclusion:'Test'}];
const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),page=document.getElementById('projectPage'),content=document.getElementById('projectContent'),dialog=document.getElementById('submitDialog'),form=document.getElementById('form');
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function render(){const q=search.value.toLowerCase().trim(),list=projects.filter(p=>(`${p.title} ${p.name}`).toLowerCase().includes(q));count.textContent=`${list.length} ${list.length===1?'project':'projects'}`;grid.innerHTML=list.length?list.map((p,i)=>`<article class="card" style="animation-delay:${Math.min(i*55,220)}ms"><div class="card-image">PROJECT IMAGE</div><div class="card-content"><h3>${esc(p.title)}</h3><p class="meta">${esc(p.name)}</p><button class="view" data-id="${p.id}">View project →</button></div></article>`).join(''):'<div class="empty">No projects match your search.</div>';grid.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openProject(+b.dataset.id))}
function openProject(id){const p=projects.find(x=>x.id===id);if(!p)return;content.innerHTML=`<div class="detail-image">PROJECT IMAGE</div><div class="detail-video">PROJECT VIDEO</div><div class="detail-content"><h1>${esc(p.title)}</h1><div class="detail-meta">${esc(p.name)}</div>${[['Research Question',p.question],['Hypothesis',p.hypothesis],['Method',p.method],['Results',p.results],['Conclusion',p.conclusion]].map(([h,v])=>`<section class="detail-section"><h2>${h}</h2><p>${esc(v)}</p></section>`).join('')}</div>`;page.classList.add('open');document.body.style.overflow='hidden'}
function closePage(){page.classList.remove('open');document.body.style.overflow=''}
search.oninput=render;document.getElementById('projectsBtn').onclick=()=>grid.scrollIntoView({behavior:'smooth'});document.getElementById('home').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});document.getElementById('backBtn').onclick=closePage;document.getElementById('submitBtn').onclick=()=>dialog.classList.add('open');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dialog.classList.remove('open'));dialog.onclick=e=>{if(e.target===dialog)dialog.classList.remove('open')};document.onkeydown=e=>{if(e.key==='Escape'){closePage();dialog.classList.remove('open')}};
form.onsubmit=e=>{e.preventDefault();projects.unshift({id:Date.now(),title:title.value.trim(),name:name.value.trim(),question:question.value.trim(),hypothesis:hypothesis.value.trim(),method:method.value.trim(),results:results.value.trim(),conclusion:conclusion.value.trim()});form.reset();dialog.classList.remove('open');render()};render();
</script>
</body>
</html>
