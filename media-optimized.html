<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Science Fair 2026</title></head><body><p style="font:15px system-ui;padding:24px">Loading Science Fair…</p><script>
(async()=>{try{
const r=await fetch('/index.html',{cache:'no-store'});if(!r.ok)throw new Error('Could not load the main page.');let h=await r.text();
h=h.replace('<div><label>Project media</label><div class="media">','<div><label>Project media</label><label class="media-opt-note" style="display:flex;gap:8px;align-items:center;margin:10px 0;font-weight:650"><input id="autoOptimize" type="checkbox" checked> Automatically optimize large images <small style="font-weight:400;color:#63758a">Resizes to 2000px max and converts to WebP</small></label><div class="media">');
const oldMedia="function mediaCheck(f,isVideo){if(!f)return null;const max=isVideo?100*1024*1024:20*1024*1024;if(f.size>max){toast('error',isVideo?'Video too large':'Image too large',`Maximum size is ${isVideo?'100 MB':'20 MB'}.`);return null}return f}";
const newMedia="function mediaCheck(f,isVideo){if(!f)return null;const max=isVideo?100*1024*1024:20*1024*1024;if(f.size>max){toast('error',isVideo?'Video too large':'Image too large',`Maximum size is ${isVideo?'100 MB':'20 MB'}.`);return null}return f};const MAX_VIDEO_SECONDS=120;let selectedVideoDuration=0;function getVideoDuration(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{const d=v.duration;URL.revokeObjectURL(url);v.remove();Number.isFinite(d)?resolve(d):reject(new Error('Could not read video duration.'))};v.onerror=()=>{URL.revokeObjectURL(url);v.remove();reject(new Error('Could not read video duration.'))};v.src=url})}async function optimizeImage(file){if(!file||file.type==='image/gif'||!$('autoOptimize')?.checked)return file;const bmp=await createImageBitmap(file),maxDim=2000,scale=Math.min(1,maxDim/Math.max(bmp.width,bmp.height)),w=Math.max(1,Math.round(bmp.width*scale)),h=Math.max(1,Math.round(bmp.height*scale));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{alpha:true});ctx.drawImage(bmp,0,0,w,h);bmp.close?.();const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('Image optimization failed.')),'image/webp',.82));return new File([blob],(file.name.replace(/\.[^.]+$/,'')||'image')+'.webp',{type:'image/webp',lastModified:Date.now()})}";
if(!h.includes(oldMedia))throw new Error('Media validation code changed; patch stopped safely.');h=h.replace(oldMedia,newMedia);
const oldInputs="$('uploadImage').onclick=()=>$('imageFile').click();$('uploadVideo').onclick=()=>$('videoFile').click();$('imageFile').onchange=e=>{selectedImage=mediaCheck(e.target.files[0],false);$('imageName').textContent=selectedImage?.name||'No image selected'};$('videoFile').onchange=e=>{selectedVideo=mediaCheck(e.target.files[0],true);$('videoName').textContent=selectedVideo?.name||'No video selected'};";
const newInputs="$('uploadImage').onclick=()=>$('imageFile').click();$('uploadVideo').onclick=()=>$('videoFile').click();$('imageFile').onchange=e=>{selectedImage=mediaCheck(e.target.files[0],false);$('imageName').textContent=selectedImage?.name||'No image selected'};$('videoFile').onchange=async e=>{const f=mediaCheck(e.target.files[0],true);selectedVideo=null;selectedVideoDuration=0;if(!f){$('videoName').textContent='No video selected';return}try{const d=await getVideoDuration(f);if(d>MAX_VIDEO_SECONDS+1e-6){$('videoFile').value='';$('videoName').textContent='No video selected';toast('error','Video is too long','Videos must be 2 minutes (120 seconds) or shorter.');return}selectedVideo=f;selectedVideoDuration=d;const m=Math.floor(d/60),s=Math.floor(d%60).toString().padStart(2,'0');$('videoName').textContent=`${f.name} · ${m}:${s}`}catch(err){$('videoFile').value='';$('videoName').textContent='No video selected';toast('error','Video could not be checked','The video duration could not be read, so it was not accepted.')}};";
if(!h.includes(oldInputs))throw new Error('Media input code changed; patch stopped safely.');h=h.replace(oldInputs,newInputs);
const oldForm="let row=result.project;let imageUrl=null,videoUrl=null;if(selectedImage)imageUrl=await uploadFile(selectedImage,row.id);if(selectedVideo)videoUrl=await uploadFile(selectedVideo,row.id);";
const newForm="let row=result.project;if(selectedVideo&&selectedVideoDuration>MAX_VIDEO_SECONDS+1e-6)throw new Error('Videos must be 2 minutes (120 seconds) or shorter.');let imageUrl=null,videoUrl=null;if(selectedImage){let imageFile=selectedImage;if($('autoOptimize')?.checked){try{imageFile=await optimizeImage(imageFile)}catch(e){throw new Error(e.message||'Image optimization failed.')}}imageUrl=await uploadFile(imageFile,row.id)}if(selectedVideo)videoUrl=await uploadFile(selectedVideo,row.id);";
if(!h.includes(oldForm))throw new Error('Form upload code changed; patch stopped safely.');h=h.replace(oldForm,newForm);document.open();document.write(h);document.close();
}catch(e){document.body.innerHTML='<pre style="font:14px system-ui;padding:24px;white-space:pre-wrap">Science Fair could not load. '+String(e.message||e)+'</pre>'}}})();
</script></body></html>
